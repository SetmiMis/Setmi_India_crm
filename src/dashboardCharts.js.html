<script>
/* =====================================================
   DASHBOARD APEXCHARTS & MAP
===================================================== */

// Pure renderer now — data comes from loadDash()'s single getDashboardData() call instead of
// this function firing its own separate google.script.run round-trip (which used to re-scan
// the whole sheet a second time on every dashboard load/filter change).
function renderAllCharts(data) {
   renderMonthChart(data.months);
   renderSourceChart(data.sources);
   renderPriorityChart(data.priorities);
   renderLeadByChart(data.leadBy);
   renderIndiaMap(data.states || []);
}

function renderMonthChart(d) {
    if(!document.querySelector("#chartMonth")) return;
    document.querySelector("#chartMonth").innerHTML = ""; 
    var options = { chart: { type: 'area', height: 250, toolbar: { show: false }, fontFamily: 'Plus Jakarta Sans' }, series: [{ name: 'Enquiries', data: d.data }], xaxis: { categories: d.categories, tooltip: { enabled: false } }, stroke: { curve: 'smooth', width: 3 }, colors: ['#0f9dc7'], fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.4, opacityTo: 0.05, stops: [0, 90, 100] } }, dataLabels: { enabled: false } };
    new ApexCharts(document.querySelector("#chartMonth"), options).render();
}

function renderSourceChart(d) {
    if(!document.querySelector("#chartSource")) return;
    document.querySelector("#chartSource").innerHTML = ""; 
    var options = { chart: { type: 'donut', height: 250, fontFamily: 'Plus Jakarta Sans' }, series: d.data, labels: d.labels, colors: ['#0f9dc7', '#54a737', '#e0962a', '#8b5cf6', '#f43f5e', '#3b82f6', '#10b981'], legend: { position: 'bottom' }, dataLabels: { enabled: false }, plotOptions: { pie: { donut: { size: '65%' } } } };
    new ApexCharts(document.querySelector("#chartSource"), options).render();
}

function renderPriorityChart(d) {
    if(!document.querySelector("#chartPriority")) return;
    document.querySelector("#chartPriority").innerHTML = ""; 
    var options = { chart: { type: 'pie', height: 250, fontFamily: 'Plus Jakarta Sans' }, series: d.data, labels: d.labels, colors: ['#ef4444', '#f59e0b', '#3b82f6'], legend: { position: 'bottom' }, dataLabels: { enabled: false }, stroke: { width: 0 } };
    new ApexCharts(document.querySelector("#chartPriority"), options).render();
}

function renderLeadByChart(d) {
    if(!document.querySelector("#chartLeadBy")) return;
    document.querySelector("#chartLeadBy").innerHTML = ""; 
    var options = { chart: { type: 'bar', height: 250, toolbar: { show: false }, fontFamily: 'Plus Jakarta Sans' }, series: [{ name: 'Enquiries', data: d.data }], xaxis: { categories: d.labels }, colors: ['#8b5cf6'], plotOptions: { bar: { borderRadius: 4, horizontal: true, distributed: true } }, dataLabels: { enabled: true, textAnchor: 'start', style: { colors: ['#fff'] }, offsetX: 10 }, tooltip: { theme: 'light' } };
    new ApexCharts(document.querySelector("#chartLeadBy"), options).render();
}

/* ================= MAP & TABLE LOGIC =================
   Real Leaflet/OSM tiles, same as the MAP Analytics tab — was Google's flat-shape GeoChart (no
   tiles/terrain), which is the "cartoon" look this app moved away from everywhere else. */
var dashMap_ = null;
var dashMapMarkers_ = [];

function renderIndiaMap(statesData) {
    var el = document.getElementById('indiaMap');
    if (!el) return;

    var mappable = statesData.filter(function(s){ return s.lat!=null && s.lng!=null; });
    window.dashStatesData = statesData;

    if (!mappable.length){ el.innerHTML = '<div class="empty">No mappable data yet</div>'; return; }

    if (!dashMap_){
      dashMap_ = L.map(el, { scrollWheelZoom: true }).setView([22.8, 80], 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
      }).addTo(dashMap_);
    }
    dashMapMarkers_.forEach(function(m){ dashMap_.removeLayer(m); });
    dashMapMarkers_ = [];

    var max = Math.max.apply(null, mappable.map(function(s){ return s.count; })) || 1;
    mappable.forEach(function(s){
      var marker = L.circleMarker([s.lat, s.lng], {
        radius: 4 + Math.sqrt(s.count/max)*16,
        color: '#0f9dc7', fillColor: '#0f9dc7', fillOpacity: 0.45, weight: 1
      }).addTo(dashMap_);
      marker.bindPopup('<b>'+esc(s.state)+'</b><br>'+s.count+' enquiries');
      marker.on('click', function(){
        renderRegionTable(statesData, s.iso);
        document.getElementById('regionLabel').innerHTML = 'Filtered by: <b style="color:var(--cyan)">' + esc(s.state) + '</b> <a href="#" onclick="renderRegionTable(window.dashStatesData, null); return false;">(Clear)</a>';
      });
      dashMapMarkers_.push(marker);
    });

    renderRegionTable(statesData, null);
}

function renderRegionTable(statesData, filterIso) {
    var list = statesData;
    if (filterIso) {
        list = statesData.filter(function(s) { return s.iso === filterIso; });
    }
    
    if (list.length === 0) {
        document.getElementById('regionTable').innerHTML = '<div class="empty">No data found</div>';
        return;
    }

    var html = '<table style="width:100%"><thead><tr><th style="text-align:left">State</th><th style="text-align:left">Enq</th></tr></thead><tbody>';
    list.forEach(function(s) {
        html += '<tr><td><b>' + esc(s.state) + '</b></td><td>' + s.count + '</td></tr>';
    });
    html += '</tbody></table>';
    
    document.getElementById('regionTable').innerHTML = html;
}
</script>
