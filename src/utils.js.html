<script>
function rupee(n){ n=Number(n)||0; return '₹'+n.toLocaleString('en-IN'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function badge(st){ return '<span class="badge b-'+String(st).replace('-','')+'">'+st+'</span>'; }
function toast(m){ var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},3200); }
function val(id){ var el=document.getElementById(id); return el?el.value:''; }
function setv(id,v){ var el=document.getElementById(id); if(el) el.value=v||''; }
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function phoneDigits(p){ return String(p==null?'':p).replace(/\D/g,''); }
// Accepts a bare 10-digit Indian mobile number, optionally prefixed with 0 or 91/+91.
function isValidPhone(p){
  var d = phoneDigits(p);
  if (d.length === 12 && d.indexOf('91') === 0) d = d.slice(2);
  else if (d.length === 11 && d.indexOf('0') === 0) d = d.slice(1);
  return d.length === 10;
}
function waLink(phone){ var d=phoneDigits(phone); if(d.length===10) d='91'+d; return 'https://wa.me/'+d; }
function telLink(phone){ return 'tel:'+phoneDigits(phone); }
function updateFuBadge(overdueCount, todayCount){
  var n = (overdueCount||0) + (todayCount||0);
  var el = document.getElementById('fuBadge');
  if (el) el.innerHTML = n ? ('<span class="badge b-Lost">'+n+'</span>') : '';
}

/* PINCODE LOOKUP — shared by New Enquiry + Edit Enquiry so the same 6-digit pincode typed twice
   in one session doesn't hit api.postalpincode.in a second time. */
var PINCODE_CACHE_ = {};
function fetchPincodeInto(pinId, distId, stateId, citySelId){
  var pin = val(pinId).trim();
  var cityDropdown = document.getElementById(citySelId);
  if (pin.length !== 6) return;

  if (PINCODE_CACHE_[pin]){ applyPincodeResult_(PINCODE_CACHE_[pin], distId, stateId, cityDropdown); return; }

  if (cityDropdown) cityDropdown.innerHTML = '<option value="">Loading areas...</option>';

  fetch('https://api.postalpincode.in/pincode/' + pin)
  .then(function(res){ return res.json(); })
  .then(function(data){
    if (data[0].Status !== 'Success'){
      setv(distId, ''); setv(stateId, '');
      if (cityDropdown) cityDropdown.innerHTML = '<option value="">Invalid Pincode</option>';
      toast('Invalid Pincode');
      return;
    }
    PINCODE_CACHE_[pin] = data[0].PostOffice;
    applyPincodeResult_(data[0].PostOffice, distId, stateId, cityDropdown);
  })
  .catch(function(){
    toast('Unable to fetch pincode.');
    if (cityDropdown) cityDropdown.innerHTML = '<option value="">Error</option>';
  });
}
/* SHARED FORM VALIDATION — all treat an empty value as valid; these only check format once
   something has actually been typed, since every field here except name/phone is optional. */
function isValidEmail(v){ return !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim()); }
function isValidGST(v){ return !v || /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z][Z][0-9A-Z]$/i.test(String(v).trim()); }
function isValidPincode(v){ return !v || /^[1-9][0-9]{5}$/.test(String(v).trim()); }

function setFieldError(id, msg){
  var el = document.getElementById(id);
  if (!el) return;
  var errEl = document.getElementById(id+'Err');
  if (!errEl){
    errEl = document.createElement('div');
    errEl.id = id+'Err';
    errEl.className = 'field-err';
    el.parentNode.appendChild(errEl);
  }
  errEl.textContent = msg || '';
  el.classList.toggle('input-err', !!msg);
}
function clearFieldErrors(ids){ ids.forEach(function(id){ setFieldError(id, ''); }); }

function applyPincodeResult_(postOffices, distId, stateId, cityDropdown){
  setv(distId, postOffices[0].District || '');
  setv(stateId, postOffices[0].State || '');
  if (!cityDropdown) return;
  var optionsHTML = '<option value="">-- Select Area --</option>';
  for (var i=0; i<postOffices.length; i++){
    optionsHTML += '<option value="' + esc(postOffices[i].Name) + '">' + esc(postOffices[i].Name) + '</option>';
  }
  cityDropdown.innerHTML = optionsHTML;
}
</script>
