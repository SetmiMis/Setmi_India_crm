<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --ink:#13384a; --muted:#5d7c8a; --cyan:#0f9dc7; --green:#54a737; --line:rgba(19,56,74,.14); }
*{box-sizing:border-box}
body{ margin:0; color:var(--ink); font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:linear-gradient(160deg,#eaf7fb,#cfe7ef 60%,#bbdce8); min-height:100vh; padding:18px; }
.logo{font-family:'Chakra Petch';font-weight:700;font-size:24px;text-align:center;color:#2c5f73}
.logo .in{color:var(--green)}
.tag{text-align:center;color:var(--muted);font-size:12px;margin:2px 0 16px}
.card{ background:rgba(255,255,255,.85); border:1px solid #fff; border-radius:18px; padding:18px;
  box-shadow:0 10px 30px rgba(20,80,110,.12); max-width:440px; margin:0 auto; }
label{font-size:13px;color:var(--muted);font-weight:600;display:block;margin:12px 0 5px 2px}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:13px;width:100%}
input[readonly]{background:#eef4f7;cursor:not-allowed;opacity:.8}
.btn{ width:100%; background:linear-gradient(100deg,#62b842,#3f8c2a); color:#fff; border:none;
  border-radius:14px; padding:16px; font-weight:800; font-family:'Chakra Petch'; font-size:17px; margin-top:18px; cursor:pointer;}
.btn:disabled{opacity:.6}
.row2{display:flex;gap:10px} .row2>div{flex:1}
.ok{text-align:center;padding:30px 12px}
.tick{width:74px;height:74px;border-radius:50%;background:var(--green);margin:0 auto 14px;position:relative;animation:pop .4s}
.tick:after{content:'';position:absolute;left:27px;top:14px;width:14px;height:30px;border:solid #fff;border-width:0 5px 5px 0;transform:rotate(45deg)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.spin{display:inline-block;width:17px;height:17px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
input.input-err,select.input-err{border-color:#d9594a}
.field-err{color:#d9594a;font-size:12px;margin:4px 0 0 2px}
.dup-warning{background:rgba(224,150,42,.14);border:1px solid #e0962a;color:#a3660f;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:600;margin-top:12px}
</style>
</head>
<body>
<div class="logo">SETMI <span class="in">INDIA</span></div>
<div class="tag">New Enquiry · Field Capture</div>

<div class="card" id="form">
  <label>Customer Name *</label><input id="cust" autocomplete="off" onblur="validateField('cust')">
  <label>Company</label><input id="comp" autocomplete="off">
  <label>Phone *</label><input id="phone" inputmode="tel" autocomplete="off" onblur="onPhoneBlur()">
  <div id="dupWarning" class="dup-warning hidden"></div>
  
  <div class="row2">
      <div>
          <label>Email</label>
          <input id="email" inputmode="email" onblur="validateField('email')">
      </div>
      <div>
          <label>GST No.</label>
          <input id="gst" onblur="validateField('gst')">
      </div>
  </div>

  <div class="row2">
      <div>
          <label>Pincode</label>
          <input id="pincode" maxlength="6" inputmode="numeric" onkeyup="fetchPincode()" onblur="validateField('pincode')">
      </div>
      <div>
          <label>District</label>
          <input id="district" readonly>
      </div>
  </div>

  <div class="row2">
      <div>
          <label>State</label>
          <input id="state" readonly>
      </div>
      <div>
          <label>City / Area</label>
          <select id="city"><option value="">-- Select Area --</option></select>
      </div>
  </div>

  <div class="row2">
    <div><label>Source</label><select id="source"></select></div>
    <div><label>Priority</label><select id="pri"></select></div>
  </div>

  <label>Requirement / Products</label>
  <textarea id="req" rows="3" placeholder="e.g. SP-series IP68 connectors, 200 pcs"></textarea>
  <div class="row2">
    <div><label>Lead By</label><select id="lead"></select></div>
  </div>
  <button class="btn" id="save" onclick="submit()">Submit Enquiry</button>
  <div class="hint">Submitted for review — a team member will confirm it shortly.</div>
</div>

<div class="card ok hidden" id="done">
  <div class="tick"></div>
  <h2 style="margin:0;font-family:'Chakra Petch'">Enquiry Submitted ✓</h2>
  <div id="doneId" style="color:var(--muted);margin-top:6px">Our team will review it shortly.</div>
  <button class="btn" style="background:linear-gradient(100deg,#62b842,#3f8c2a)" onclick="reset()">+ Add Another</button>
</div>

<script>
function opts(arr){ return arr.map(function(x){return '<option>'+x+'</option>';}).join(''); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
// Accepts a bare 10-digit Indian mobile number, optionally prefixed with 0 or 91/+91.
function isValidPhone(p){
  var d = String(p||'').replace(/\D/g,'');
  if (d.length === 12 && d.indexOf('91') === 0) d = d.slice(2);
  else if (d.length === 11 && d.indexOf('0') === 0) d = d.slice(1);
  return d.length === 10;
}
function isValidEmail(v){ return !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim()); }
function isValidGST(v){ return !v || /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z][Z][0-9A-Z]$/i.test(String(v).trim()); }
function isValidPincode(v){ return !v || /^[1-9][0-9]{5}$/.test(String(v).trim()); }

function setFieldError(id, msg){
  var el = document.getElementById(id);
  if (!el) return;
  var errEl = document.getElementById(id+'Err');
  if (!errEl){
    errEl = document.createElement('div');
    errEl.id = id+'Err';
    errEl.className = 'field-err';
    el.parentNode.appendChild(errEl);
  }
  errEl.textContent = msg || '';
  el.classList.toggle('input-err', !!msg);
}
var VALIDATE_IDS = ['cust','phone','email','gst','pincode'];
function validateField(id){
  var v = gv(id);
  var ok = true, msg = '';
  if (id === 'cust'){ ok = !!v.trim(); msg = ok ? '' : 'Customer name is required'; }
  else if (id === 'phone'){
    if (!v.trim()){ ok = false; msg = 'Phone is required'; }
    else { ok = isValidPhone(v); msg = ok ? '' : 'Enter a valid 10-digit phone number'; }
  }
  else if (id === 'email'){ ok = isValidEmail(v); msg = ok ? '' : 'Enter a valid email address'; }
  else if (id === 'gst'){ ok = isValidGST(v); msg = ok ? '' : 'Enter a valid 15-character GSTIN'; }
  else if (id === 'pincode'){ ok = isValidPincode(v); msg = ok ? '' : 'Enter a valid 6-digit pincode'; }
  setFieldError(id, msg);
  return ok;
}
function validateForm(){
  var allOk = true;
  VALIDATE_IDS.forEach(function(id){ if (!validateField(id)) allOk = false; });
  return allOk;
}

// Lightweight warning only — no customer auto-fill here, since this page is unauthenticated and
// public; auto-filling another customer's details for any phone number typed in would leak more
// than the aggregate count/date this endpoint deliberately limits itself to.
function onPhoneBlur(){
  validateField('phone');
  var phone = gv('phone').trim();
  var warnEl = document.getElementById('dupWarning');
  if (!isValidPhone(phone)){ if (warnEl) warnEl.classList.add('hidden'); return; }
  google.script.run.withSuccessHandler(function(r){
    if (!warnEl) return;
    if (r.found){
      warnEl.textContent = '⚠ This number already has '+r.count+' enquiry(ies) with us — last on '+(r.lastDate||'—')+' ('+(r.lastStage||'—')+'). You can still save a new one.';
      warnEl.classList.remove('hidden');
    } else {
      warnEl.classList.add('hidden');
    }
  }).checkPhoneDuplicate(phone);
}

google.script.run.withSuccessHandler(function(m){
  document.getElementById('source').innerHTML=opts(m.sources);
  document.getElementById('pri').innerHTML=opts(m.priorities);
  document.getElementById('lead').innerHTML=opts(m.team);
  document.getElementById('pri').value='Warm';
}).getConfigMeta();

function submit(){
  if (!validateForm()){ alert('Please fix the highlighted fields'); return; }
  var cust=document.getElementById('cust').value.trim();
  var phone=document.getElementById('phone').value.trim();

  var b=document.getElementById('save');
  b.disabled=true; 
  b.innerHTML='<span class="spin"></span> Saving…';
  
  var p = {
      customer: cust,
      company: gv("comp"),
      phone: phone,
      email: gv("email"),
      gst: gv("gst"),
      pincode: gv("pincode"),
      district: gv("district"),
      state: gv("state"),
      city: gv("city"),
      source: gv("source"),
      priority: gv("pri"),
      leadBy: gv("lead"),
      requirement: gv("req")
  };
  
  google.script.run.withSuccessHandler(function(r){
    if(r.ok){
      document.getElementById('form').classList.add('hidden');
      document.getElementById('done').classList.remove('hidden');
    } else {
      alert(r.msg); b.disabled=false; b.innerHTML='Submit Enquiry';
    }
  }).withFailureHandler(function(e){
    alert('Error: '+e.message); b.disabled=false; b.innerHTML='Submit Enquiry';
  }).submitFieldEnquiry(p);
}

function gv(id){ 
    var el = document.getElementById(id);
    return el ? el.value : ''; 
}

function reset(){
  ['cust','comp','phone','email','gst','pincode','district','state','city','req'].forEach(function(id){
      document.getElementById(id).value="";
  });
  VALIDATE_IDS.forEach(function(id){ setFieldError(id, ''); });
  var dupEl = document.getElementById('dupWarning'); if (dupEl) dupEl.classList.add('hidden');
  document.getElementById('done').classList.add('hidden');
  document.getElementById('form').classList.remove('hidden');
  var b=document.getElementById('save'); b.disabled=false; b.innerHTML='Submit Enquiry';
}

var PINCODE_CACHE_ = {}; // avoids re-hitting the API if the same pincode is retyped in this session
function applyPincodeResult_(postOffices){
    document.getElementById("district").value = postOffices[0].District || "";
    document.getElementById("state").value = postOffices[0].State || "";
    var optionsHTML = '<option value="">-- Select Area --</option>';
    for(var i=0; i < postOffices.length; i++){
        optionsHTML += '<option value="' + esc(postOffices[i].Name) + '">' + esc(postOffices[i].Name) + '</option>';
    }
    document.getElementById("city").innerHTML = optionsHTML;
}
function fetchPincode(){
    var pin = gv("pincode").trim();
    var cityDropdown = document.getElementById("city");

    if(pin.length != 6){ return; }

    if (PINCODE_CACHE_[pin]){ applyPincodeResult_(PINCODE_CACHE_[pin]); return; }

    // Pincode check hote waqt Loading dikhayega
    cityDropdown.innerHTML = '<option value="">Loading areas...</option>';

    fetch("https://api.postalpincode.in/pincode/" + pin)
    .then(function(res){ return res.json(); })
    .then(function(data){
        if(data[0].Status != "Success"){
            document.getElementById("district").value = "";
            document.getElementById("state").value = "";
            cityDropdown.innerHTML = '<option value="">Invalid Pincode</option>';
            alert("Invalid Pincode");
            return;
        }
        PINCODE_CACHE_[pin] = data[0].PostOffice;
        applyPincodeResult_(data[0].PostOffice);
    })
    .catch(function(){
        alert("Unable to fetch pincode.");
        cityDropdown.innerHTML = '<option value="">Error</option>';
    });
}
</script>
</body>
</html>
