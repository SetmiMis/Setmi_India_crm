# Continuous Integration — validation only. This workflow never deploys to Apps Script and needs
# no Google credentials. See docs/12_CI_CD_AND_RELEASE_PROCESS.md for what each job proves (and
# what it does not).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Structure, syntax, secrets, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Required files present
        run: npm run check:structure

      - name: Syntax check (server .js + inline <script> blocks in .html)
        run: npm run check:syntax

      - name: Project-specific secret patterns
        run: npm run check:secrets

      - name: Unit + contract tests
        run: npm test

  web:
    name: New CRM (web/) — lint, types, unit + database/RLS tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Reference data is in sync with the legacy source
        run: |
          npm run gen:reference
          git diff --exit-code -- ../supabase/seed src/lib/geo

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Database tests (migrations, RLS allow/deny, workflows, data migration) on PGlite
        run: npm run test:db

      - name: Production build
        run: npm run build

      - name: Dependency audit (high/critical, production deps)
        run: npm audit --omit=dev --audit-level=high

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose --exit-code 1
